# cargo-deny configuration for oxpulse-sfu-kit
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all feature combinations to catch issues hidden behind feature flags.
all-features = true

# ---------------------------------------------------------------------------
# Advisories — deny known vulnerabilities, unmaintained crates, unsound code
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# No advisories are ignored; an empty list means all are enforced.
ignore = []

# ---------------------------------------------------------------------------
# Licenses — allowlist of permissive / compatible licenses
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-or-later",
    # Public-domain / maximally permissive
    "CC0-1.0",
    "Unlicense",
]

# ---------------------------------------------------------------------------
# Bans — warn on duplicate versions, no banned crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ---------------------------------------------------------------------------
# Sources — only allow crates.io and our own GitHub org
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["anatolykoptev"]
